<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カタン期待値</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f7f2; color: #243a32;
      font-family: system-ui, sans-serif; }
    main { max-width: 720px; margin: auto; padding: 24px 12px 40px; }
    h1 { margin: 0; font-size: 28px; }
    h2 { margin: 0 0 12px; font-size: 20px; }
    p { line-height: 1.6; }
    .muted { color: #637269; font-size: 13px; }
    .card { margin: 16px 0; padding: 12px; background: white;
      border: 1px solid #dce2d9; border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { padding: 10px 5px; text-align: left;
      border-bottom: 1px solid #e5e9e2; }
    th { background: #edf3eb; font-size: 14px; }
    .summary-wrap { overflow-x: auto; }
    .summary { min-width: 300px; font-size: 12px; }
    .summary th, .summary td { text-align: center; padding: 10px 2px; }
    .summary th { font-size: 11px; }
    .summary .resource { width: 48px; text-align: left; }
    .summary td { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .summary tfoot { background: #e5efdf; font-weight: bold; }
    .summary .current { background: #fff1d8; }
    .summary .port-cell { white-space: normal; vertical-align: top;
      overflow-wrap: anywhere; font-size: 10px; }
    .port-item + .port-item { margin-top: 6px; }
    .radar { display: block; width: 100%; max-width: 440px; margin: auto; }
    .legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px; margin-top: 8px; }
    .legend label { display: flex; align-items: center; gap: 5px;
      min-height: 44px; padding: 6px; font-size: 12px;
      border: 1px solid #dce2d9; border-radius: 8px; cursor: pointer; }
    .legend input { width: 18px; height: 18px; margin: 0; accent-color: #b96612; }
    .legend svg { width: 20px; height: 8px; flex-shrink: 0; }
    .dot { display: inline-block; width: 11px; height: 11px; margin-right: 4px;
      border-radius: 50%; background: var(--color); border: 1px solid #888;
      vertical-align: middle; }
    .summary .dot { display: block; margin: 0 auto 4px; }
    .players { display: grid; grid-template-columns: repeat(6, 1fr);
      gap: 5px; margin: 20px 0; }
    button, select { font: inherit; min-height: 44px; border-radius: 8px; }
    button { cursor: pointer; padding: 8px; border: 1px solid #b9c5bd;
      background: white; color: #243a32; }
    button:hover { background: #edf3eb; }
    .player-button { font-size: 12px; padding: 8px 2px; }
    .player-button .dot { display: block; margin: 0 auto 5px; }
    .player-button[aria-pressed="true"] { border: 2px solid #b96612;
      background: #fff1d8; font-weight: bold; }
    :focus-visible { outline: 3px solid #e38421; outline-offset: 2px; }
    .toolbar { display: flex; align-items: center; gap: 8px;
      flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar label { flex: 1; min-width: 140px; }
    .port-label { display: block; margin-bottom: 12px; font-size: 14px; }
    .port-label select { margin-top: 4px; }
    .count-label { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
    .count-label select { width: 100px; }
    select { width: 100%; padding: 8px; border: 1px solid #b9c5bd;
      background: white; color: #243a32; }
    .badge { font-size: 13px; }
    .add { width: 100%; background: #d96b0d; color: white;
      border: none; font-weight: bold; }
    .add:hover { background: #bb5705; }
  </style>
</head>
<body>
  <main>
    <h1>🎲 カタン期待値</h1>
    <p class="muted">配置と貿易港を登録し、資源の獲得量を比較します。</p>
    <label class="count-label">プレイヤー人数
      <select id="player-count">
        <option value="3">3人</option><option value="4">4人</option>
        <option value="5">5人</option><option value="6">6人</option>
      </select>
    </label>
    <section class="card" aria-labelledby="summary-title">
      <h2 id="summary-title">全プレイヤーの期待値</h2>
      <p class="muted">各資源の獲得枚数／サイコロ1回。都市は2倍で計算。</p>
      <div class="summary-wrap" id="summary" aria-live="polite"></div>
    </section>
    <section class="card" aria-labelledby="chart-title">
      <h2 id="chart-title">資源バランス</h2>
      <p class="muted">外側ほど、その資源の獲得期待値が大きくなります。</p>
      <div id="radar"></div>
      <div class="legend" id="legend" aria-label="グラフに表示するプレイヤー"></div>
      <p class="muted" id="chart-note"></p>
    </section>
    <nav class="players" id="players" aria-label="編集するプレイヤー"></nav>
    <h2 id="player-title"></h2>
    <div id="buildings"></div>
    <button class="add" id="add" type="button">＋ 建物を追加</button>
    <p class="muted">各建物に最大3タイルを入力。不要な行は「未選択」のままでOK。</p>
    <p class="muted">港は交換比率を記録するための項目です。資源の獲得期待値には影響しません。</p>
    <p class="muted">盗賊の影響は含みません。7は資源を生産しないため選択肢から除外しています。</p>
    <p class="muted">赤の入力はサンプルです。この確認版では、再読み込みすると全員の入力がリセットされます。</p>
  </main>
  <script>
    const resources = ['材木', 'れんが', '小麦', '羊', '石'];
    const ports = ['港なし', '一般港(3:1)', '木材港(2:1)', 'れんが港(2:1)',
      '小麦港(2:1)', '羊港(2:1)', '石港(2:1)'];
    const ways = { 2: 1, 3: 2, 4: 3, 5: 4, 6: 5,
      8: 5, 9: 4, 10: 3, 11: 2, 12: 1 };
    const blankTile = () => ({ number: '', resource: '' });
    const blankBuilding = () => ({ type: '開拓地', port: '港なし',
      tiles: Array.from({ length: 3 }, blankTile) });
    const players = [
      ['赤', '#d34b42'], ['青', '#3575bb'], ['白', '#ffffff'],
      ['オレンジ', '#ed8c27'], ['茶色', '#885738'], ['緑', '#418b55']
    ].map(([name, color]) => ({ name, color, buildings: [blankBuilding()] }));
    players[0].buildings = [
      { type: '開拓地', port: '一般港(3:1)', tiles: [
        { number: '5', resource: '材木' },
        { number: '8', resource: '羊' },
        { number: '10', resource: '小麦' }
      ] },
      { type: '都市', port: '港なし', tiles: [
        { number: '6', resource: '石' },
        { number: '9', resource: 'れんが' }, blankTile()
      ] }
    ];
    let activePlayer = 0;
    let playerCount = 3;
    const chartVisible = players.map(() => true);
    const container = document.querySelector('#buildings');
    function options(values, selected) {
      return values.map(value => `<option value="${value}"
        ${value === selected ? 'selected' : ''}>${value || '未選択'}</option>`).join('');
    }
    function dot(player) {
      return `<span class="dot" style="--color:${player.color}" aria-hidden="true"></span>`;
    }
    function totalsFor(player) {
      const totals = Object.fromEntries(resources.map(resource => [resource, 0]));
      player.buildings.forEach(building => building.tiles.forEach(tile => {
        if (tile.number && tile.resource) {
          totals[tile.resource] += ways[tile.number] * (building.type === '都市' ? 2 : 1);
        }
      }));
      return totals;
    }
    function ownedPorts(player) {
      const owned = new Set(player.buildings.map(building => building.port));
      return ports.slice(1).filter(port => owned.has(port));
    }
    function lineColor(index) {
      return index === 2 ? '#687078' : players[index].color;
    }
    function lineDash(index) {
      return ['', '7 3', '2 3', '10 3 2 3', '5 3 2 3', '12 4'][index];
    }
    function renderLegend() {
      document.querySelector('#legend').innerHTML = players.slice(0, playerCount).map((player, index) => `
        <label>
          <input type="checkbox" data-chart-player="${index}" ${chartVisible[index] ? 'checked' : ''}>
          <svg viewBox="0 0 20 8" aria-hidden="true"><line x1="0" y1="4" x2="20" y2="4"
            stroke="${lineColor(index)}" stroke-width="3" stroke-dasharray="${lineDash(index)}"/></svg>
          ${player.name}
        </label>`).join('');
    }
    function renderRadar(totals) {
      const cx = 180, cy = 175, radius = 110;
      const max = Math.max(0, ...totals.flatMap(total => Object.values(total)));
      const step = Math.max(1, Math.ceil(max / 4));
      const limit = step * 4;
      const point = (index, distance) => {
        const angle = (-90 + index * 72) * Math.PI / 180;
        return [cx + Math.cos(angle) * distance, cy + Math.sin(angle) * distance];
      };
      const polygon = distance => resources.map((_, index) => point(index, distance).join(',')).join(' ');
      const grid = [1, 2, 3, 4].map(ring => `
        <polygon points="${polygon(radius * ring / 4)}" fill="none" stroke="#dce2d9"/>
        <text x="${cx + 6}" y="${cy - radius * ring / 4 + 4}" font-size="10" fill="#637269">${step * ring}/36</text>
      `).join('');
      const axes = resources.map((resource, index) => {
        const [x, y] = point(index, radius);
        const [tx, ty] = point(index, radius + 30);
        const anchor = tx < cx - 10 ? 'end' : tx > cx + 10 ? 'start' : 'middle';
        return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#dce2d9"/>
          <text x="${tx}" y="${ty + 5}" text-anchor="${anchor}" font-size="14" fill="#243a32">${resource}</text>`;
      }).join('');
      const series = totals.map((total, index) => {
        if (!chartVisible[index]) return '';
        const points = resources.map((resource, axis) => point(axis, radius * total[resource] / limit));
        return `<g data-series="${index}">
          <polygon points="${points.map(p => p.join(',')).join(' ')}" fill="${lineColor(index)}"
            fill-opacity="0.07" stroke="${lineColor(index)}" stroke-width="2.5" stroke-dasharray="${lineDash(index)}"/>
          ${points.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.5" fill="${lineColor(index)}"/>`).join('')}
        </g>`;
      }).join('');
      document.querySelector('#radar').innerHTML = `
        <svg class="radar" viewBox="0 0 360 340" data-limit="${limit}" role="img"
          aria-labelledby="radar-title radar-desc">
          <title id="radar-title">プレイヤー別の資源獲得期待値</title>
          <desc id="radar-desc">材木、れんが、小麦、羊、石を共通の目盛りで比較します。正確な値は上の表に記載しています。</desc>
          ${axes}${grid}${series}
        </svg>`;
      const anyVisible = chartVisible.slice(0, playerCount).some(Boolean);
      document.querySelector('#chart-note').textContent = anyVisible
        ? `外周は${limit}/36枚／回。目盛りは参加者全員の値から自動調整します。チェックで線の表示を切り替えられます。白は灰色の点線です。`
        : '表示するプレイヤーにチェックを入れてください。';
    }
    function renderSummary() {
      const visiblePlayers = players.slice(0, playerCount);
      const totals = visiblePlayers.map(totalsFor);
      const cell = (value, index) => `<td class="${index === activePlayer ? 'current' : ''}">${value}/36</td>`;
      document.querySelector('#summary').innerHTML = `
        <table class="summary">
          <thead><tr><th class="resource" scope="col">資源</th>
            ${visiblePlayers.map((player, index) => `<th scope="col"
              class="${index === activePlayer ? 'current' : ''}">${dot(player)}${player.name}</th>`).join('')}
          </tr></thead>
          <tbody>${resources.map(resource => `<tr>
            <th class="resource" scope="row">${resource}</th>
            ${totals.map((total, index) => cell(total[resource], index)).join('')}
          </tr>`).join('')}
          <tr><th class="resource" scope="row">所有港</th>
            ${visiblePlayers.map((player, index) => {
              const owned = ownedPorts(player);
              return `<td class="port-cell ${index === activePlayer ? 'current' : ''}">
                ${owned.length ? owned.map(port => `<div class="port-item">${port}</div>`).join('') : '—'}
              </td>`;
            }).join('')}
          </tr></tbody>
          <tfoot><tr><th class="resource" scope="row">合計</th>
            ${totals.map((total, index) => cell(Object.values(total).reduce((a, b) => a + b, 0), index)).join('')}
          </tr></tfoot>
        </table>`;
      renderRadar(totals);
    }
    function renderBuildings() {
      const player = players[activePlayer];
      document.querySelector('#player-title').innerHTML = `${dot(player)}${player.name}の建物と隣接タイル`;
      container.innerHTML = player.buildings.map((building, index) => `
        <section class="card" data-building="${index}" aria-label="建物${index + 1}">
          <div class="toolbar">
            <label>建物${index + 1}
              <select data-field="type" aria-label="建物${index + 1}の種類">
                ${options(['開拓地', '都市'], building.type)}
              </select>
            </label>
            <span class="badge">×${building.type === '都市' ? 2 : 1}</span>
            <button type="button" data-delete aria-label="建物${index + 1}を削除">削除</button>
          </div>
          <label class="port-label">貿易港
            <select data-field="port" aria-label="建物${index + 1}の貿易港">
              ${options(ports, building.port)}
            </select>
          </label>
          <table>
            <thead><tr><th scope="col">出目</th><th scope="col">資源</th></tr></thead>
            <tbody>${building.tiles.map((tile, row) => `<tr>
              <td><select data-row="${row}" data-field="number"
                aria-label="建物${index + 1}、タイル${row + 1}の出目">
                ${options(['', ...Object.keys(ways)], tile.number)}
              </select></td>
              <td><select data-row="${row}" data-field="resource"
                aria-label="建物${index + 1}、タイル${row + 1}の資源">
                ${options(['', ...resources], tile.resource)}
              </select></td>
            </tr>`).join('')}</tbody>
          </table>
        </section>`).join('') || '<p class="muted">建物がありません。「建物を追加」から登録できます。</p>';
      renderSummary();
    }
    function refreshPlayerButtons() {
      document.querySelectorAll('[data-player]').forEach(button => {
        button.setAttribute('aria-pressed', String(Number(button.dataset.player) === activePlayer));
      });
    }
    function renderPlayerButtons() {
      const nav = document.querySelector('#players');
      nav.style.gridTemplateColumns = `repeat(${playerCount}, 1fr)`;
      nav.innerHTML = players.slice(0, playerCount).map((player, index) => `
        <button class="player-button" type="button" data-player="${index}"
          aria-pressed="${index === activePlayer}">${dot(player)}${player.name}</button>`).join('');
    }
    document.querySelector('#player-count').addEventListener('change', event => {
      playerCount = Number(event.target.value);
      if (activePlayer >= playerCount) activePlayer = 0;
      renderPlayerButtons();
      renderLegend();
      renderBuildings();
    });
    document.querySelector('#players').addEventListener('click', event => {
      const button = event.target.closest('[data-player]');
      if (!button) return;
      activePlayer = Number(button.dataset.player);
      refreshPlayerButtons();
      renderBuildings();
    });
    container.addEventListener('change', event => {
      const field = event.target.dataset.field;
      if (!field) return;
      const section = event.target.closest('[data-building]');
      const building = players[activePlayer].buildings[Number(section.dataset.building)];
      if (field === 'type') {
        building.type = event.target.value;
        section.querySelector('.badge').textContent = `×${building.type === '都市' ? 2 : 1}`;
      } else if (field === 'port') {
        building.port = event.target.value;
      } else {
        building.tiles[Number(event.target.dataset.row)][field] = event.target.value;
      }
      renderSummary();
    });
    container.addEventListener('click', event => {
      if (!event.target.closest('[data-delete]')) return;
      const index = Number(event.target.closest('[data-building]').dataset.building);
      players[activePlayer].buildings.splice(index, 1);
      renderBuildings();
    });
    document.querySelector('#add').addEventListener('click', () => {
      players[activePlayer].buildings.push(blankBuilding());
      renderBuildings();
      container.lastElementChild.querySelector('select').focus();
    });
    document.querySelector('#legend').addEventListener('change', event => {
      if (!event.target.matches('[data-chart-player]')) return;
      chartVisible[Number(event.target.dataset.chartPlayer)] = event.target.checked;
      renderRadar(players.slice(0, playerCount).map(totalsFor));
    });
    renderPlayerButtons();
    renderLegend();
    renderBuildings();
  </script>
</body>
</html>
